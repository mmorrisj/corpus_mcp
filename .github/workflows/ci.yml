name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: pip install -e ".[dev]"

      - name: Lint
        run: |
          ruff check src tests scripts
          ruff format --check src tests scripts

      - name: Test
        run: pytest -q

      # Launch the server the way an MCP host does -- as a subprocess speaking
      # JSON-RPC over stdio -- and check it answers. The in-process tests cover
      # protocol behaviour; this covers packaging, the console script, and the
      # stdio transport, which those cannot.
      - name: Smoke-test the installed server over stdio
        run: python scripts/stdio_smoke.py examples/corpus
